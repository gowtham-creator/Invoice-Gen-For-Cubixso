# Netlify builds this in the cloud, which is deliberate: the project lives on an
# external drive that stalls local bundler builds.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Netlify auto-installs its Next.js plugin, which expects a server build in
  # .next. This app is a static export in out/, and Netlify documents that
  # static-only Next.js sites must skip the plugin or the deploy fails.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# The fonts are immutable and fingerprinted by name, so they can be cached hard.
# They are also large enough (400 KB each) to be worth not re-fetching.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Sign-in gate. The invoicer is served only to a Netlify Identity account with
# the "owner" role (lib/auth.ts). Netlify's CDN checks the role inside the
# signed nf_jwt cookie before serving anything, so the app never reaches a
# browser that has not signed in. Rules run top to bottom; the first match
# wins, and `force` makes each apply even though the files exist.
# ---------------------------------------------------------------------------

# Open to everyone: Identity's own endpoints, the sign-in page, and what that
# page needs to draw. /_next/ holds the compiled code, which carries no
# invoices (those live in the browser); the images are the logo, signature and
# seal the invoices embed, already public in the repository, and kept open so a
# PDF still renders if the session lapses while the tab is open.
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

# One rule serves both /login and /login/: Netlify ignores a trailing slash
# when matching, so a separate /login -> /login/ redirect also caught /login/
# and sent it to itself, in a loop no browser would open.
[[redirects]]
  from = "/login/*"
  to = "/login/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/fonts/*"
  to = "/fonts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cubixso-logo.png"
  to = "/cubixso-logo.png"
  status = 200
  force = true

[[redirects]]
  from = "/cubixso-logo-light.png"
  to = "/cubixso-logo-light.png"
  status = 200
  force = true

[[redirects]]
  from = "/signature.png"
  to = "/signature.png"
  status = 200
  force = true

[[redirects]]
  from = "/signature-light.png"
  to = "/signature-light.png"
  status = 200
  force = true

[[redirects]]
  from = "/seal.png"
  to = "/seal.png"
  status = 200
  force = true

[[redirects]]
  from = "/seal-light.png"
  to = "/seal-light.png"
  status = 200
  force = true

# Everything else: the owner gets the app, anyone else the sign-in page.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true
  conditions = {Role = ["owner"]}

[[redirects]]
  from = "/*"
  to = "/login/"
  status = 302
  force = true
