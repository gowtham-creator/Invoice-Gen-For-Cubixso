# Netlify builds this in the cloud, which is deliberate: the project lives on an
# external drive that stalls local bundler builds.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The fonts are immutable and fingerprinted by name, so they can be cached hard.
# They are also large enough (400 KB each) to be worth not re-fetching.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
